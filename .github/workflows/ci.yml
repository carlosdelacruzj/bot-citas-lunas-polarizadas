name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        env:
          POSTGRES_DB: appointment_bot_ci
          POSTGRES_USER: appointment_bot_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appointment_bot_ci -d appointment_bot_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APPOINTMENT_DATABASE_URL: postgresql://appointment_bot_ci:ci-only-password@127.0.0.1:5432/appointment_bot_ci
      TARGET_URL: https://example.invalid
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python 3.12.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Compile Python
        run: python -m compileall -q src

      - name: Lint Python
        run: python -m ruff check src tests

      - name: Test backend
        run: >-
          python -m pytest -q
          --junitxml=reports/ci/pytest.xml
          --cov=appointment_bot
          --cov-branch
          --cov-report=term
          --cov-report=json:reports/ci/coverage.json

      - name: Enforce critical backend coverage
        run: python scripts/check-critical-coverage.py reports/ci/coverage.json

      - name: Audit Python dependencies
        run: python -m pip_audit --require-hashes -r requirements-dev.lock

      - name: Check installed Python dependencies
        run: python -m pip check

      - name: Validate documentation
        shell: pwsh
        run: ./scripts/check-documentation.ps1

      - name: Check whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
          else
            git show --check --format= "$GITHUB_SHA"
          fi

      - name: Upload backend results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-test-results
          path: |
            reports/ci/pytest.xml
            reports/ci/coverage.json
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js 22.15.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.15.0
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dashboard-build
          path: dashboard/dist/dashboard
          if-no-files-found: error
          retention-days: 7
