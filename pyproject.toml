[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "obtener-lunas-polarizadas"
version = "0.1.0"
description = "Automatizador personal para revisar disponibilidad de citas."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "2captcha-python>=1.5.1",
    "cryptography>=42.0.0",
    "Pillow>=12.0.0",
    "playwright>=1.44.0",
    "psycopg[binary,pool]>=3.2.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pip-audit>=2.10.1,<3",
    "pip-tools>=7.6.1,<8",
    "pytest>=9.0.3,<10",
    "ruff>=0.15.22,<0.16",
    "setuptools>=84,<85",
]

[project.scripts]
appointment-bot-admin-api = "appointment_bot.admin_api.server:main"
appointment-bot-client = "appointment_bot.services.client_cli:run"
appointment-bot-telegram-control = "appointment_bot.services.telegram_control:main"
appointment-bot-worker = "appointment_bot.worker.host:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
appointment_bot = ["assets/brand/*.jpeg", "assets/brand/*.png"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
