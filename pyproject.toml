[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "obtener-lunas-polarizadas"
version = "0.1.0"
description = "Automatizador personal para revisar disponibilidad de citas."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "2captcha-python>=1.5.1",
    "playwright>=1.44.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
]

[project.scripts]
appointment-bot = "appointment_bot.services.queue_runner:main"
appointment-bot-run-queue = "appointment_bot.services.queue_runner:main"
appointment-bot-test-telegram = "appointment_bot.services.notifier:run_telegram_test"
appointment-bot-local-api = "appointment_bot.services.local_api:run_local_api"
appointment-bot-client = "appointment_bot.services.client_cli:run"
appointment-bot-probe-availability = "appointment_bot.services.observer:main"
appointment-bot-worker = "appointment_bot.services.continuous_host:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
