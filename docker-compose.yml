services:
  postgres:
    image: postgres:16
    container_name: appointment-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APPOINTMENT_POSTGRES_USER:-appointment_bot}
      POSTGRES_PASSWORD: ${APPOINTMENT_POSTGRES_PASSWORD:?Set APPOINTMENT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${APPOINTMENT_POSTGRES_DB:-appointment_bot}
    ports:
      - "127.0.0.1:${APPOINTMENT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - appointment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  appointment_postgres_data:
